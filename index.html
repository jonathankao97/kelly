<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b0b0f" />
<title>Kalshi Kelly Sizer</title>
<style>
  :root {
    --bg: #0b0b0f;
    --card: #16171d;
    --border: #262832;
    --text: #e8e8ee;
    --muted: #9a9ba5;
    --accent: #4ea1ff;
    --good: #4ade80;
    --bad: #f87171;
    --buy: #4ade80;
    --sell: #fb923c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #e3e5eb;
      --text: #17181d;
      --muted: #60636c;
      --accent: #1a73e8;
      --good: #16a34a;
      --bad: #dc2626;
      --buy: #16a34a;
      --sell: #ea580c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%; }
  body { padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 16px); }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 16px; font-weight: 600; letter-spacing: -0.01em; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="tel"] {
    width: 100%; background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 17px; outline: none;
    font-variant-numeric: tabular-nums;
  }
  input:focus { border-color: var(--accent); }
  .row { margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: white; border: none; border-radius: 10px;
    -webkit-appearance: none; cursor: pointer;
  }
  button:active { opacity: 0.85; }
  .status { margin: 12px 0 0; font-size: 14px; min-height: 20px; }
  .status.buy { color: var(--buy); font-weight: 600; }
  .status.sell { color: var(--sell); font-weight: 600; }
  .status.err { color: var(--bad); }
  .status.muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 10px 6px; font-size: 14px;
    border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.03em; }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: none; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kalshi Kelly Sizer</h1>

  <div class="card">
    <div class="row">
      <label for="bankroll">Bankroll ($)</label>
      <input id="bankroll" type="text" inputmode="decimal" autocomplete="off" value="100,000" />
    </div>
    <div class="row">
      <label for="price">Contract price ($, 0-1)</label>
      <input id="price" type="text" inputmode="decimal" autocomplete="off" value="0.50" />
    </div>
    <div class="row">
      <label for="theo">Contract theo ($, 0-1)</label>
      <input id="theo" type="text" inputmode="decimal" autocomplete="off" value="0.55" />
    </div>
    <div class="row" style="margin-top:16px">
      <button id="calc">Calculate</button>
    </div>
    <div id="status" class="status muted"></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Kelly</th>
          <th>Contracts</th>
          <th>At risk ($)</th>
          <th>$ edge</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="foot">Buy when price &lt; theo, sell when price &gt; theo. Sizing is on capital at risk.</div>
</div>

<script>
  const KELLY_LEVELS = [
    ["Full Kelly", 1.0],
    ["3/4 Kelly", 0.75],
    ["1/2 Kelly", 0.5],
    ["1/4 Kelly", 0.25],
    ["1/8 Kelly", 0.125],
  ];

  const fmt = (n, d = 2) => n.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });

  function compute(bankroll, price, theo) {
    if (price === theo) {
      return {
        side: "No edge", f: 0,
        rows: KELLY_LEVELS.map(([label]) => [label, 0, 0, 0]),
      };
    }
    let side, f, cost;
    if (price < theo) {
      side = "BUY";
      f = (theo - price) / (1.0 - price);
      cost = price;
    } else {
      side = "SELL";
      f = (price - theo) / price;
      cost = 1.0 - price;
    }
    const edgePer = Math.abs(theo - price);
    const rows = KELLY_LEVELS.map(([label, mult]) => {
      const stake = mult * f * bankroll;
      const contracts = stake / cost;
      return [label, contracts, stake, edgePer * contracts];
    });
    return { side, f, rows };
  }

  const bankrollEl = document.getElementById("bankroll");
  const priceEl = document.getElementById("price");
  const theoEl = document.getElementById("theo");
  const statusEl = document.getElementById("status");
  const rowsEl = document.getElementById("rows");

  bankrollEl.addEventListener("input", () => {
    const raw = bankrollEl.value;
    let cleaned = "", sawDot = false;
    for (const ch of raw) {
      if (ch >= "0" && ch <= "9") cleaned += ch;
      else if (ch === "." && !sawDot) { cleaned += ch; sawDot = true; }
    }
    let out;
    if (cleaned === "" || cleaned === ".") out = cleaned;
    else if (cleaned.includes(".")) {
      const [i, d] = cleaned.split(".");
      out = `${Number(i || 0).toLocaleString()}.${d}`;
    } else {
      out = Number(cleaned).toLocaleString();
    }
    if (out !== raw) bankrollEl.value = out;
  });

  function calculate() {
    rowsEl.innerHTML = "";
    const bankroll = parseFloat(bankrollEl.value.replace(/,/g, ""));
    const price = parseFloat(priceEl.value);
    const theo = parseFloat(theoEl.value);

    if (![bankroll, price, theo].every(Number.isFinite)) {
      statusEl.className = "status err";
      statusEl.textContent = "Enter valid numbers.";
      return;
    }
    if (bankroll <= 0) {
      statusEl.className = "status err";
      statusEl.textContent = "Bankroll must be positive.";
      return;
    }
    if (!(price > 0 && price < 1) || !(theo > 0 && theo < 1)) {
      statusEl.className = "status err";
      statusEl.textContent = "Price and theo must be strictly between 0 and 1.";
      return;
    }

    const { side, f, rows } = compute(bankroll, price, theo);
    if (side === "No edge") {
      statusEl.className = "status muted";
      statusEl.textContent = "Price equals theo — no edge, bet 0.";
    } else {
      statusEl.className = "status " + side.toLowerCase();
      statusEl.textContent = `${side}  |  full Kelly = ${(f * 100).toFixed(2)}% of bankroll`;
    }

    for (const [label, contracts, dollars, edge] of rows) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${label}</td>
        <td>${fmt(contracts)}</td>
        <td>$${fmt(dollars)}</td>
        <td>$${fmt(edge)}</td>
      `;
      rowsEl.appendChild(tr);
    }
  }

  document.getElementById("calc").addEventListener("click", calculate);
  for (const el of [bankrollEl, priceEl, theoEl]) {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); calculate(); } });
  }
  calculate();
</script>
</body>
</html>
